name: imon-web
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: file:./data/imonbuildweb.db
    volumes:
      - imon_data:/app/data
      - imon_uploads:/app/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 40s
      timeout: 15s
      start_period: 90s
      retries: 3
volumes:
  imon_data:
  imon_uploads:
